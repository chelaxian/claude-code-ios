name: build

# Builds both rootless variants on a macOS runner: the launcher needs the
# iPhoneOS SDK from Xcode, which only exists there. Nothing requires a local Mac.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish both .deb files as a GitHub release'
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.flavor }} (${{ matrix.cpu_arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu_arch: arm64
            deb_arch: iphoneos-arm64
            flavor: Dopamine rootless
          - cpu_arch: arm64e
            deb_arch: iphoneos-arm64e
            flavor: RootHide

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install dpkg ldid
          python3 --version

      - name: Show SDK
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build ${{ matrix.flavor }} launcher
        run: bash ./build-launcher.sh '${{ matrix.cpu_arch }}'

      - name: Fetch base CyPwn deb
        # The base carries the self-contained iOS Node runtime, app assets and
        # shim. build.sh replaces the broken launcher with this matrix's slice.
        run: |
          set -euo pipefail
          URL="https://github.com/ba31k/claude-code-ios/releases/download/v2.1.112-1/claude-code-ios_2.1.112-1_iphoneos-arm64.deb"
          curl -fL --retry 3 --retry-delay 5 -o base.deb "$URL"
          ls -la base.deb

      - name: Build ${{ matrix.flavor }} package
        run: bash ./build.sh base.deb '${{ matrix.cpu_arch }}'

      - name: Verify package and launcher
        run: |
          set -euo pipefail
          DEB=$(ls ./com.ratush.claude-code-ios_*_${{ matrix.deb_arch }}.deb)
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.ratush.claude-code-ios'
          test "$(dpkg-deb -f "$DEB" Architecture)" = '${{ matrix.deb_arch }}'
          test "$(dpkg-deb -f "$DEB" Section)" = 'Tweaks'
          mkdir -p verify
          dpkg-deb -x "$DEB" verify
          BIN=verify/var/jb/Applications/ClaudeCode.app/ClaudeCode
          test -f "$BIN"
          echo "--- launcher architecture ---"
          lipo -info "$BIN" | grep -w '${{ matrix.cpu_arch }}'
          echo "--- strings: expect one fixed iGhostty URL handoff, no prelaunch ---"
          strings "$BIN" | grep -E 'ighostty://claude|uiopen' || {
            echo "launcher does not contain the expected strings"; exit 1; }
          if strings "$BIN" | grep -qE 'newterm3://|ssh://claude|ws\.hbang\.Terminal|wiki\.qaq\.iGhostty'; then
            echo "launcher contains a stale terminal integration or iGhostty prelaunch"; exit 1
          fi
          ldid -h "$BIN"
          SHELL=verify/var/jb/usr/local/lib/claude-code/ighostty-shell
          test -x "$SHELL"
          lipo -info "$SHELL" | grep -w '${{ matrix.cpu_arch }}'
          ldid -h "$SHELL"
          strings "$SHELL" | grep -Fx '/usr/local/lib/claude-code/ighostty-shell'
          strings "$SHELL" | grep -Fx '/usr/bin/zsh'
          strings "$SHELL" | grep -Fx '/usr/local/bin/claude'
          if strings "$SHELL" | grep -Fq '/var/jb/usr/bin/zsh'; then
            echo "adapter hardcodes a rootless zsh path"; exit 1
          fi
          test "$(dpkg-deb -f "$DEB" Depends)" = 'firmware (>= 15.0), zsh, ldid, wiki.qaq.ighostty (>= 0.2.6)'

      - uses: actions/upload-artifact@v4
        with:
          name: claude-code-ios-${{ matrix.cpu_arch }}
          path: ./com.ratush.claude-code-ios_*_${{ matrix.deb_arch }}.deb
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: claude-code-ios-*
          merge-multiple: true
      - name: Publish both architecture variants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la artifacts
          VER=$(basename artifacts/com.ratush.claude-code-ios_*_iphoneos-arm64.deb | sed -E 's/^com\.ratush\.claude-code-ios_(.+)_iphoneos-arm64\.deb$/\1/')
          gh release create "v${VER}" artifacts/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${VER} — Dopamine and RootHide" \
            --notes "Claude Code iOS launcher opens iGhostty through the fixed \`ighostty://claude\` handoff, with no arbitrary command or arguments. Includes \`iphoneos-arm64\` for Dopamine rootless and \`iphoneos-arm64e\` for RootHide." \
            || gh release upload "v${VER}" artifacts/*.deb --repo "$GITHUB_REPOSITORY" --clobber
